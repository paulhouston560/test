name: Download Gists

on:
  schedule:
    - cron: "0 22 * * *"  # UTC 22:00 = 北京时间早上6:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run downloader
        env:
          GISTS: ${{ secrets.GISTS }}
        run: python download_gists.py

      - name: Commit results if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Update gist results"
          git push
