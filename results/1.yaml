rules:
- PROCESS-NAME,subs-check.exe,DIRECT
- PROCESS-NAME,subs-check,DIRECT
- RULE-SET,LocalAreaNetwork,DIRECT
- RULE-SET,AI,AI
- RULE-SET,OpenAi,AI
- RULE-SET,Netflix,NETFLIX
- RULE-SET,YouTube,YOUTUBE
