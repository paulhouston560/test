proxy-groups:
- name: PROXY
  type: select
  proxies:
  - STABLE
  - AUTO
  - DIRECT
- name: STABLE
  type: fallback
  include-all: true
  url: https://www.gstatic.com/generate_204
  interval: 180
  lazy: false
  timeout: 5000
  max-failed-times: 2
  expected-status: 204
- name: AUTO
  type: url-test
  include-all: true
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 150
  lazy: false
  timeout: 5000
  max-failed-times: 2
  expected-status: 204
- name: AI
  type: select
  proxies:
  - STABLE
  - AUTO
  - PROXY
  - DIRECT
- name: NETFLIX
  type: select
  proxies:
  - STABLE
  - AUTO
  - PROXY
  - DIRECT
- name: YOUTUBE
  type: select
  proxies:
  - STABLE
  - AUTO
  - PROXY
  - DIRECT
- name: TELEGRAM
  type: select
  proxies:
  - STABLE
  - AUTO
  - PROXY
  - DIRECT
- name: TWITTER
  type: select
  proxies:
  - PROXY
  - STABLE
  - AUTO
  - AI
  - NETFLIX
  - YOUTUBE
  - TELEGRAM
  - DIRECT
rule-providers:
  LocalAreaNetwork:
    type: http
